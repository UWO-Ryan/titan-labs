takeaway:
  - "<strong>The same AI can be an answer machine or a coach — and you choose which by what you ask.</strong> You saw it coach, slip, give a fresh answer every time, explain the same idea a brand-new way, and solve one step more than it should have."
  - "Next you stop watching and start steering. In <strong>Teach-It-Back</strong>, you'll bring something you honestly don't get, make the Coach switch strategies until one clicks — and then teach it to someone even more confused than you were."
  - "<span style=\"font-size: 16px; color: #000000;\"><strong>Asking for an answer and asking to be taught are two different requests. Only one of them makes you better at the subject.</strong></span>"
