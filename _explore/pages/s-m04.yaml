    notice:
      - "It corrected the claim — the usual version is about <em>pollinators</em>, not just bees — and named where to check."
      - "We checked. USDA's own pages put it this way: one in three bites exists because of animal pollinators, including bees, butterflies, birds, bats, and beetles — and they call it an estimate. <strong>Check the exact wording, not just the number.</strong>"
takeaway:
